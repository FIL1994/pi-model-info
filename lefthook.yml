pre-commit:
  commands:
    format:
      glob: "*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json,jsonc,yaml,yml,md}"
      run: npx oxfmt --write {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}"
      run: npx oxlint {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}
